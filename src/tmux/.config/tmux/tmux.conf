# Use C-a as prefix
unbind-key C-b
set -g prefix C-a
bind-key a send-prefix

# Window navigation
bind-key H       select-window -p
bind-key S-Left  select-window -p
bind-key L       select-window -n
bind-key S-Right select-window -n

# Pane navigation
bind-key h     select-pane -L
bind-key Left  select-pane -L
bind-key j     select-pane -D
bind-key Down  select-pane -D
bind-key k     select-pane -U
bind-key Up    select-pane -U
bind-key l     select-pane -R
bind-key Right select-pane -R

# Split panes
bind-key - split-window -v
bind-key _ split-window -v
bind-key | split-window -h
bind-key \\ split-window -h

# Enable mouse
setw -g mouse on

# Vim copy/paste behavior
setw -g mode-keys vi
unbind-key [
unbind-key p
bind-key Escape copy-mode
bind-key p paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy" \; display-message "Copied tmux buffer to system clipboard"

# Default TERM
set -g default-terminal "screen-256color"

# Status line
set -g status-style fg=white,bg=default
set -g status-left  "#[fg=blue bold]#h  "
set -g status-right-length 100
set -g status-right "#[fg=yellow]  %d-%b-%Y %I:%M %p"
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=brightwhite bold][#I:#W]"
set -g pane-active-border-style fg=colour39

# Reload configuration
# Keybinding: C-a R
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded configuration"

# Switch to most recent window
# Keybinding: C-a C-a
bind-key c-a last-window

# Enable synchronized panes
# Keybinding: C-a M-s
bind-key m-s setw synchronize-panes on \; display-message "synchronize-panes: on"

# Disable synchronized panes
# Keybinding: C-a M-S
bind-key m-S setw synchronize-panes off \; display-message "synchronize-panes: off"
